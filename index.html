<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0110 - HOME</title>
    
    <link rel="icon" type="image/png" href="assets/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #00f3ff;
        --secondary: #bd00ff;
        --dark: #050505;
        --grid-color: #333; 
        --text-glow: 0 0 10px var(--primary);
        --box-bg: rgba(0, 20, 20, 0.9);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        height: 100vh;
        width: 100vw;
        background: #000;
        font-family: "Inconsolata", monospace;
        color: white;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* --- SCALING WRAPPER --- */
      #main-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        transform: scale(1.00); 
        transform-origin: center center;
      }

      /* --- FADE TRANSITIONS --- */
      #fade-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: black; z-index: 2000; pointer-events: none;
        opacity: 1; transition: opacity 1.5s ease-in-out;
      }
      body.loaded #fade-overlay { opacity: 0; }
      body.exiting #fade-overlay { opacity: 1; transition: opacity 2s ease-in-out; }

      /* --- MUSIC TOGGLE --- */
      #music-toggle {
          position: absolute; top: 30px; right: 30px; z-index: 100;
          color: #444; cursor: pointer; font-size: 24px; transition: 0.3s;
      }
      #music-toggle:hover { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
      #music-toggle.active { color: var(--primary); }

      /* --- LEFT SECTION (TITLE) --- */
      #section-left {
        flex: 1;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        padding: 40px;
        border-right: 1px solid #000;
        z-index: 5;
      }

      #title-container { text-align: center; margin-bottom: 40px; }

      h1 {
        font-size: 100px;
        line-height: 0.9;
        letter-spacing: 15px;
        margin: 0;
        color: #fff;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px var(--primary);
        animation: flicker 4s infinite;
      }

      h2 {
        font-size: 32px;
        letter-spacing: 8px;
        margin: 10px 0 0 0;
        color: var(--primary);
        text-shadow: 0 0 15px var(--primary);
        font-weight: 400;
        opacity: 0.9;
      }

      #quote-text {
        margin-top: 20px;
        font-size: 16px;
        color: #ffffff;
        letter-spacing: 2px;
        text-align: center;
        font-style: italic;
        opacity: 0.8;
        animation: pulse 4s infinite ease-in-out;
      }

      #version-text {
        position: absolute; bottom: 40px; left: 40px; 
        font-size: 12px; color: #666; letter-spacing: 1px;
      }

      /* --- RIGHT SECTION (INTERACTIVE) --- */
      #section-right {
        flex: 1;
        background-color: #000; /* Default Dark */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden; /* Keep cursor inside */
      }

      /* THE FLASHLIGHT GRID LAYER */
      #flashlight-grid {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        /* The Grid Pattern */
        background-image: 
          linear-gradient(#cccccc 1px, transparent 1px),
          linear-gradient(90deg, #cccccc 1px, transparent 1px);
        background-size: 40px 40px;
        
        /* The Flashlight Mask (Reveals grid at --x, --y) */
        mask-image: radial-gradient(circle 300px at var(--x, 50%) var(--y, 50%), black 0%, transparent 100%);
        -webkit-mask-image: radial-gradient(circle 300px at var(--x, 50%) var(--y, 50%), black 0%, transparent 100%);
        
        pointer-events: none; /* Let clicks pass through to menu */
        opacity: 0; /* Hidden until mouse enters */
        transition: opacity 0.3s ease;
        z-index: 1;
      }

      /* THE GAMEPLAY CURSOR (Glowing Circle) */
      /* THE GAMEPLAY CURSOR (Glowing Circle) */
      #custom-cursor {
        position: absolute;
        width: 20px; height: 20px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 20; 
        opacity: 0;
        transition: opacity 0.2s; /* Removed 'left' and 'top' transition for instant tracking */
      }

      /* Vignette for depth (Always visible) */
      #section-right::after {
        content: "";
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, transparent 0%, #000 120%);
        pointer-events: none;
        z-index: 2;
      }

      /* GLOBAL GLOW CONTAINER (Behind Menu) */
      #menu-glow-container {
        position: absolute;
        width: 400px;
        height: 500px;
        background: radial-gradient(circle, rgba(0, 243, 255, 0.08) 0%, transparent 70%);
        pointer-events: none;
        z-index: 5;
        animation: breathe 6s infinite ease-in-out;
      }

      #menu-container {
        display: flex; flex-direction: column; gap: 20px; 
        width: 350px; 
        z-index: 10; /* Must be clickable */
      }

      /* MENU BUTTONS */
      .menu-btn {
        position: relative;
        background: var(--box-bg);
        border: 1px solid #333;
        padding: 18px 25px; 
        font-family: "Inconsolata", monospace;
        font-size: 18px; 
        color: #888;
        cursor: pointer;
        transition: 0.3s;
        text-align: left;
        overflow: hidden;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .menu-btn.active {
        color: #fff;
        border-color: var(--primary);
        box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
        background: rgba(0, 40, 40, 0.95);
      }

      .menu-btn.disabled {
        opacity: 0.4; cursor: not-allowed; color: #d3d3d3;
        border-color: #333; background: rgba(0, 10, 10, 0.8);
      }

      /* Electric Border Animation */
      .menu-btn.active::after {
        content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 2px;
        background: linear-gradient(90deg, transparent, var(--primary), transparent);
        animation: electric-slide 2s infinite linear;
      }
      .menu-btn.active::before {
        content: ""; position: absolute; bottom: 0; right: -100%; width: 100%; height: 2px;
        background: linear-gradient(90deg, transparent, var(--primary), transparent);
        animation: electric-slide 2s infinite linear reverse;
      }

      .menu-btn:hover:not(.disabled) {
        color: var(--primary); text-shadow: 0 0 8px var(--primary);
        border-color: #fff; transform: translateX(5px);
        box-shadow: 0 0 15px rgba(0, 243, 255, 0.1); 
      }

      /* --- TOKEN OVERLAY --- */
      #token-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.92);
        display: none; flex-direction: column; justify-content: center; align-items: center;
        z-index: 1000; backdrop-filter: blur(8px);
      }
      #token-overlay.visible { display: flex; }

      .token-box {
        width: 450px; padding: 40px;
        background: #000; border: 1px solid #00d9ff;
        box-shadow: 0 0 40px rgba(0, 183, 255, 0.2); text-align: center;
      }
      .token-box h2 { color: #00d9ff; margin-bottom: 20px; letter-spacing: 3px; font-weight: bold; font-size: 24px;}
      .token-box p { color: #ccc; font-size: 14px; margin-bottom: 30px; line-height: 1.5; }
      
      #token-input {
        width: 90%; padding: 12px; background: #080808; border: 1px solid #444;
        color: white; font-family: "Inconsolata", monospace; text-align: center;
        font-size: 20px; margin-bottom: 25px; outline: none; letter-spacing: 2px; transition: 0.3s;
      }
      #token-input:focus { border-color: var(--secondary); box-shadow: 0 0 10px rgba(189, 0, 255, 0.3); }
      
      .token-actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
      .token-btn {
        padding: 10px 20px; cursor: pointer; background: #050505; border: 1px solid #444;
        color: #888; font-family: "Inconsolata", monospace; font-size: 12px;
        transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;
      }
      .token-btn.primary { border-color: #00d9ff; color: #00d9ff; font-weight: bold; }
      .token-btn:hover { background: #222; color: #fff; border-color: #fff; }

      /* --- ANIMATIONS --- */
      @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      @keyframes breathe { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
      @keyframes electric-slide { 0% { left: -100%; } 50% { left: 100%; } 100% { left: 100%; } }
      @keyframes flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px var(--primary); }
        20%, 24%, 55% { opacity: 0.7; text-shadow: none; }
      }
    </style>
  </head>
  <body>
    <div id="fade-overlay"></div>
    <div id="music-toggle" onclick="Menu.toggleMusic()">♫</div>

    <div id="main-wrapper">
        <div id="section-left">
            <div id="title-container">
                <h1>0110</h1>
                <h2>THE INSTITUTE</h2>
            </div>
            
            <div id="quote-text">"A life without freedom is a life wasted."</div>
            
            <div id="version-text">Build 1.11.2</div>
        </div>

        <div id="section-right">
            <div id="flashlight-grid"></div>
            <div id="custom-cursor"></div>
            
            <div id="menu-glow-container"></div>
            
            <div id="menu-container">
                <div class="menu-btn active" onclick="Menu.start()">
                    > <span id="btn-start-text">INITIALIZE</span>
                </div>
                <div class="menu-btn" onclick="Menu.loadChapters()">
                    > LOAD_CHAPTER
                </div>
                <div class="menu-btn" onclick="Menu.readStory()">
                    > READ_ARCHIVES
                </div>
                <div class="menu-btn disabled">
                    > STORE [OFFLINE]
                </div>
                <div class="menu-btn" onclick="Menu.quit()">
                    > TERMINATE
                </div>
            </div>
        </div>
    </div>

    <div id="token-overlay">
      <div class="token-box">
        <h2 id="token-title">ACCESS RESTRICTED</h2>
        <p id="token-msg">Please enter your Access Token to continue.</p>
        <input type="text" id="token-input" placeholder="ABC-123-XYZ" autocomplete="off">
        <div class="token-actions">
            <button class="token-btn primary" onclick="TokenSystem.submit()">VERIFY TOKEN</button>
            <button class="token-btn" id="btn-skip" onclick="TokenSystem.skip()">CONTINUE WITHOUT TOKEN</button>
        </div>
        <div id="token-status" style="margin-top: 15px; font-size: 12px; color: #f33;"></div>
      </div>
    </div>

    <script>
      /* --- HOME PAGE LOGIC --- */
      const GameState = {
        hasToken: false,
        token: null,
        chapter: 0,
        musicPlaying: false
      };
      
      let bgm = null;

      // INIT
      window.onload = () => {
        document.body.classList.add('loaded');
        
        // MOUSE TRACKING LOGIC
        const sectionRight = document.getElementById("section-right");
        const gridLayer = document.getElementById("flashlight-grid");
        const cursor = document.getElementById("custom-cursor");
        const buttons = document.querySelectorAll(".menu-btn");
        let isHoveringButton = false;

        // 1. Move Flashlight & Cursor (FIXED SCALING)
        sectionRight.addEventListener("mousemove", (e) => {
            const rect = sectionRight.getBoundingClientRect();
            
            // Calculate X/Y relative to the section
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;

            // --- THE FIX: COMPENSATE FOR 0.85 SCALE ---
            // If we don't divide by 0.85, the cursor moves faster than the mouse
            x = x / 1.00; 
            y = y / 1.00;

            // Update CSS Variables for Mask and Cursor position
            sectionRight.style.setProperty("--x", `${x}px`);
            sectionRight.style.setProperty("--y", `${y}px`);
            
            // Update Cursor Element Position directly (Smoother)
            cursor.style.left = `${x}px`;
            cursor.style.top = `${y}px`;
            
            // Show effects
            gridLayer.style.opacity = "1";
            
            if (!isHoveringButton) {
                cursor.style.opacity = "1";
                sectionRight.style.cursor = "none"; 
            }
        });

        // 2. Hide when leaving the right section
        sectionRight.addEventListener("mouseleave", () => {
            gridLayer.style.opacity = "0";
            cursor.style.opacity = "0";
            sectionRight.style.cursor = "default";
        });

        // 3. Handle Menu Button Interactivity
        buttons.forEach(btn => {
            btn.addEventListener("mouseenter", () => {
                isHoveringButton = true;
                cursor.style.opacity = "0"; // Hide Glowing Circle
                sectionRight.style.cursor = "pointer"; // Show System Hand
            });
            btn.addEventListener("mouseleave", () => {
                isHoveringButton = false;
                cursor.style.opacity = "1"; // Show Glowing Circle
                sectionRight.style.cursor = "none"; // Hide System Cursor
            });
        });

        // REST OF THE LOGIC (Unchanged)
        const saved = localStorage.getItem("0110_save_v2");
        if (saved) {
            const data = JSON.parse(saved);
            if (data.chapter && data.chapter >= 1) {
                GameState.chapter = data.chapter;
                document.getElementById("btn-start-text").innerText = "CONTINUE";
            }
        }

        setTimeout(() => {
            TokenSystem.check();
        }, 1500);
      };

      const Menu = {
        start: () => {
            Menu.transition(() => {
                if (GameState.chapter === 0) window.location.href = "tutorial.html";
                else window.location.href = "game.html";
            });
        },
        loadChapters: () => { alert("SYSTEM: SAVE SLOTS EMPTY"); },
        readStory: () => { window.open("https://your-story-link.com", "_blank"); },
        quit: () => {
            window.close();
            document.body.innerHTML = "<div style='display:flex;justify-content:center;align-items:center;height:100vh;background:#000;color:#333;font-family:monospace;'>TERMINATED</div>";
        },
        transition: (callback) => {
            document.body.classList.remove('loaded');
            document.body.classList.add('exiting');
            setTimeout(callback, 1500); 
        },
        toggleMusic: () => {
            const icon = document.getElementById("music-toggle");
            if (!bgm) {
                bgm = new Audio('assets/bgm1.mp3'); 
                bgm.loop = true;
                bgm.volume = 0.5;
            }
            if (GameState.musicPlaying) {
                bgm.pause();
                icon.classList.remove("active");
                icon.innerText = "♫";
            } else {
                bgm.play().catch(e => console.log("Audio Blocked"));
                icon.classList.add("active");
                icon.innerText = "🔊";
            }
            GameState.musicPlaying = !GameState.musicPlaying;
        }
      };

      const TokenSystem = {
        // REPLACE THIS WITH YOUR GOOGLE SHEET CSV LINK
        sheetURL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vREV1T2aT2NSZGp2i_VInmVnK5Oq0Xjd5HwXUaSg07S2OenHmbhnCjUelomfCMRsHALYzi5MMp2OVEP/pub?output=csv", 
        
        check: () => {
            // 1. Check if Premium is already unlocked locally
            const isUnlocked = localStorage.getItem("0110_access_token");
            
            // If unlocked, we don't need to show the overlay for Chapter 2
            if (isUnlocked && GameState.chapter >= 2) {
                 return; 
            }

            // If Paywalled (Chapter 2+) AND not unlocked -> Block Access
            const isPaywalled = GameState.chapter >= 2; 
            const overlay = document.getElementById("token-overlay");
            
            if (isPaywalled && !isUnlocked) {
                overlay.classList.add("visible");
                document.getElementById("token-title").innerText = "ACCESS RESTRICTED";
                document.getElementById("token-msg").innerText = "Chapter 2 requires a valid Access Token.";
                document.getElementById("btn-skip").style.display = "none";
            }
        },

        submit: async () => {
            const inputVal = document.getElementById("token-input").value.trim();
            const status = document.getElementById("token-status");
            
            if (!inputVal) {
                status.innerText = "ERR: EMPTY FIELD";
                return;
            }

            status.innerText = "CONNECTING TO ARCHIVE...";
            status.style.color = "#fff";
            
            try {
                // 1. Fetch the Google Sheet List
                const res = await fetch(TokenSystem.sheetURL);
                const csvText = await res.text();
                
                // 2. Parse the List (Split by new lines)
                const validTokens = csvText.split("\n").map(t => t.trim());
                
                // 3. Verify
                if (validTokens.includes(inputVal)) {
                    status.style.color = "#00ffaa";
                    status.innerText = "ACCESS GRANTED. WRITING TO DISK...";
                    
                    // Save the "Proof of Purchase" locally
                    localStorage.setItem("0110_access_token", inputVal);
                    
                    GameState.hasToken = true;
                    setTimeout(() => {
                        document.getElementById("token-overlay").classList.remove("visible");
                    }, 1000);
                } else {
                    status.style.color = "#f33";
                    status.innerText = "ERR: INVALID TOKEN KEY";
                }
            } catch (e) {
                status.innerText = "ERR: NETWORK/DATABASE OFFLINE";
            }
        },

        skip: () => {
            // Only allows skipping if NOT on Chapter 2
            document.getElementById("token-overlay").classList.remove("visible");
        }
      };
    </script>
  </body>
</html>
